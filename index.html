<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>以闪亮之名｜宠物繁育计时工具V11</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system}
body{margin:12px;background:#f7f8fa;color:#222;max-width:1400px;margin-inline:auto;padding:8px}
input,select,button{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{cursor:pointer;background:#fff}
button.primary{background:#4080ff;color:white;border-color:#3070ee}
button.warn{background:#ff6b6b;color:white;border-color:#ee5555}
button.del-opt{background:#ffeeee;color:#c82424;border-color:#ffb4b4;padding:2px 6px;font-size:12px;margin-left:6px}
.search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
#petContainer{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pet-card{border:1px solid #d8dee6;border-radius:10px;padding:12px;background:white;transition:.2s}
.pet-card.locked{border:2px solid #ff4444;background:#fff3f3}
.pet-card.alert{box-shadow:0 0 0 4px rgba(255,80,80,.4)}
.top-alert{background:#ffe9e9;border:1px solid #ffb0b0;padding:10px;border-radius:8px;margin-bottom:10px}
.card-head{display:flex;gap:10px;margin-bottom:10px}
.avatar-wrap{width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid #eee;flex-shrink:0;cursor:pointer}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.info-main{flex:1}
.pet-name{font-weight:bold;font-size:16px;margin-bottom:4px}
.gender-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:12px;margin-right:4px}
.tags-wrap{margin:4px 0}
.tag{display:inline-block;background:#e8edf4;padding:1px 5px;border-radius:3px;font-size:12px;margin:0 2px 2px 0}
.timer-area{margin:8px 0}
.ctrl-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999}
.modal-box{background:white;border-radius:10px;padding:16px;max-width:480px;width:92%;max-height:90vh;overflow:auto}
.form-row{margin:10px 0}
.form-row label{display:block;margin-bottom:4px;font-size:14px}
textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}
.hidden{display:none !important}
.img-preview-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:12px}
.img-preview-modal.show{display:flex}
.img-preview-modal img{max-width:95%;max-height:95%;object-fit:contain}
.status-idle{color:#20b060;font-weight:bold}
.status-waitpair{color:#e04080;font-weight:bold}
.gender-m{color:#348ede;font-weight:bold}
.gender-f{color:#e85496;font-weight:bold}
.opt-manage-row{margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
</style>
</head>
<body>
<div id="globalAlertBox" class="top-alert hidden"></div>
<div class="top-bar">
<button class="primary" id="btnAdd">➕新增宠物</button>
<button id="btnExport">💾导出备份</button>
<button id="btnImport">📂导入备份</button>
<button id="btnManageOpt">⚙️管理账号/品种选项</button>
</div>
<div class="search-row">
<input id="searchInput" placeholder="🔍搜索名字/标签/CP..." style="flex:1;min-width:200px">
</div>
<div class="filter-row">
<select id="filterStatusSel">
<option value="">状态</option>
<option value="cd">计时运行中</option>
<option value="paused">托管中</option>
<option value="locked">⚠母宠待接生</option>
<option value="idle">🟢空闲</option>
<option value="waitpair">💗待配对</option>
</select>
<select id="filterGenderSel">
<option value="">性别</option>
<option value="m">公</option>
<option value="f">母</option>
</select>
<select id="filterAccountSel">
<option value="">账号</option>
</select>
<select id="filterBreedSel">
<option value="">品种</option>
</select>
<!-- 新增：排序方式 -->
<select id="sortModeSel" title="排序方式">
<option value="remain">排序：剩余时间</option>
<option value="editTime">排序：编辑时间</option>
</select>
</div>
<div id="petContainer"></div>

<div class="img-preview-modal" id="imgPreviewModal">
    <img id="previewBigImg">
</div>

<div class="modal hidden" id="optManageModal">
    <div class="modal-box">
        <h3>管理账号 / 品种选项</h3>
        <div class="opt-manage-row">
            <div style="flex:1">
                <h4>账号列表</h4>
                <div id="accListWrap"></div>
            </div>
            <div style="flex:1">
                <h4>品种列表</h4>
                <div id="breedListWrap"></div>
            </div>
        </div>
        <div style="margin-top:12px;text-align:right">
            <button id="closeOptManage">关闭</button>
        </div>
    </div>
</div>

<div class="modal hidden" id="editModal">
<div class="modal-box">
<h3 id="modalTitle">新增宠物档案</h3>
<div class="form-row">
<label>宠物图片（粘贴网络链接 / Ctrl+V剪贴板粘贴图片）</label>
<input type="text" id="petImgUrl" placeholder="图片链接，焦点在此框按Ctrl+V粘贴截图">
<input type="file" accept="image/*" id="uploadImg" style="margin-top:4px">
</div>
<div class="form-row">
<label>所属账号</label>
<select id="selAccount">
<option value="">--请选择或输入--</option>
</select>
<input type="text" id="txtAccount" placeholder="可输入新账号名称" style="margin-top:4px">
</div>
<div class="form-row">
<label>品种</label>
<select id="selBreed">
<option value="">--请选择或输入--</option>
</select>
<input type="text" id="txtBreed" placeholder="可输入新品种" style="margin-top:4px">
</div>
<div class="form-row">
<label>CP配对对象</label>
<input type="text" id="petCp" placeholder="填写CP名字，留空计时结束为空闲状态">
</div>
<div class="form-row">
<label>宠物昵称</label>
<input type="text" id="petName" placeholder="宠物名字">
</div>
<div class="form-row">
<label>性别</label>
<select id="petGender">
<option value="m">公</option>
<option value="f">母</option>
</select>
</div>
<div class="form-row">
<label>总时长</label>
<div style="display:flex;gap:8px;align-items:center">
<input type="number" id="tHour" value="0" min="0" placeholder="小时">
<span>小时</span>
<input type="number" id="tMinute" value="0" min="0" max="59" placeholder="分钟">
<span>分钟</span>
</div>
</div>
<div class="form-row">
<label>标签（逗号分隔）</label>
<input type="text" id="petTags" placeholder="成年，繁育中">
</div>
<div class="form-row">
<label>计时器模式</label>
<select id="timerMode">
<option value="normal">普通计时(生长/公宠CD)</option>
<option value="breedFemale">繁育母宠模式（剩余72小时锁定待接生）</option>
</select>
</div>
<div class="form-row">
<label>备注</label>
<textarea id="petNote" rows="2"></textarea>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="primary" id="btnSave">保存</button>
<button id="btnCancel">取消</button>
<button class="warn hidden" id="btnDel">删除这条档案</button>
</div>
</div>
</div>

<script>
const STORAGE_KEY = "petTimerTS_v11";
let petList = [];
let editId = null;
let accountOptions = [];
let breedOptions = [];

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function hmToMs(h, m){return (h*60 + m)*60*1000}
function msToHMS(ms){
    const totalSec = Math.floor(Math.max(0,ms)/1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600)/60);
    const s = totalSec % 60;
    return h + "时" + m + "分" + s + "秒";
}
function formatDateTime(ts){
    if(!ts) return "-";
    const d=new Date(ts);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function escapeHtml(str){
    if(str===null||str===undefined) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function addOption(list,value){
    const v=(value||"").trim();
    if(v&&!list.includes(v)) list.push(v);
}

// 更新某只宠物的最后编辑时间
function touchPet(pet, ts){
    if(!pet) return;
    pet.utime = ts || Date.now();
}

// ===== 安全写入 localStorage（图片过大时不阻断流程）=====
function safeSave(){
    try{
        const payload={pets:petList,accounts:accountOptions,breeds:breedOptions};
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        return true;
    }catch(e){
        console.warn("localStorage写入失败（可能图片过大），数据仅保存在当前内存", e);
        return false;
    }
}
function saveToLocal(){ safeSave(); }

function loadFromLocal(){
    try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(!raw) return;
        const obj=JSON.parse(raw);
        petList=Array.isArray(obj.pets)?obj.pets:[];
        accountOptions=Array.isArray(obj.accounts)?obj.accounts:[];
        breedOptions=Array.isArray(obj.breeds)?obj.breeds:[];
        // 兼容旧数据：补齐 utime
        petList.forEach(function(p){
            if(!p.utime) p.utime = p.ctime || Date.now();
        });
    }catch(e){console.error("加载本地数据失败",e);}
}

function renderOptionManager(){
    const accWrap=document.getElementById("accListWrap");
    const breedWrap=document.getElementById("breedListWrap");
    accWrap.innerHTML="";
    breedWrap.innerHTML="";
    accountOptions.forEach((item,idx)=>{
        const div=document.createElement("div");
        div.style="margin:4px 0;display:flex;align-items:center;gap:4px";
        div.innerHTML="<span>"+escapeHtml(item)+'</span><button class="del-opt" data-type="acc" data-idx="'+idx+'">删除</button>';
        accWrap.appendChild(div);
    });
    breedOptions.forEach((item,idx)=>{
        const div=document.createElement("div");
        div.style="margin:4px 0;display:flex;align-items:center;gap:4px";
        div.innerHTML="<span>"+escapeHtml(item)+'</span><button class="del-opt" data-type="breed" data-idx="'+idx+'">删除</button>';
        breedWrap.appendChild(div);
    });
}

function fillEditSelects(selectedAcc,selectedBr){
    selectedAcc=selectedAcc||"";
    selectedBr=selectedBr||"";
    const selA=document.getElementById("selAccount");
    const selB=document.getElementById("selBreed");
    selA.innerHTML='<option value="">--请选择或输入--</option>';
    selB.innerHTML='<option value="">--请选择或输入--</option>';
    accountOptions.forEach(o=>{
        const op=document.createElement("option");
        op.value=o;op.textContent=o;
        if(o===selectedAcc) op.selected=true;
        selA.appendChild(op);
    });
    breedOptions.forEach(o=>{
        const op=document.createElement("option");
        op.value=o;op.textContent=o;
        if(o===selectedBr) op.selected=true;
        selB.appendChild(op);
    });
}

function renderFilterSelect(){
    const accSel=document.getElementById("filterAccountSel");
    const brSel=document.getElementById("filterBreedSel");
    const curA=accSel.value;
    const curB=brSel.value;
    accSel.innerHTML='<option value="">账号</option>';
    brSel.innerHTML='<option value="">品种</option>';
    accountOptions.forEach(o=>{
        const op=document.createElement("option");op.value=o;op.textContent=o;accSel.appendChild(op);
    });
    breedOptions.forEach(o=>{
        const op=document.createElement("option");op.value=o;op.textContent=o;brSel.appendChild(op);
    });
    accSel.value=curA;
    brSel.value=curB;
}

function getPetRemainMs(pet,now){
    now=now||Date.now();
    if(!pet.isRunning) return pet.pausedAt||0;
    const spent=now-(pet.startTs||now);
    return Math.max(0,(pet.totalMs||0)-spent);
}
function getEstimateEndTime(pet,now){
    now=now||Date.now();
    const rem=getPetRemainMs(pet,now);
    if(!pet.isRunning||rem<=0) return null;
    return now+rem;
}
function startPetTimer(pet,now){
    pet.isRunning=true;
    pet.startTs=now||Date.now();
    touchPet(pet,pet.startTs);
}
function pausePetTimer(pet,now){
    now=now||Date.now();
    pet.pausedAt=getPetRemainMs(pet,now);
    pet.isRunning=false;
    touchPet(pet,now);
}
function resetPetTimer(pet,now){
    now=now||Date.now();
    pet.isRunning=false;
    pet.startTs=null;
    pet.pausedAt=pet.totalMs||0;
    pet.locked=false;
    touchPet(pet,now);
}
function deliverBaby(pet,now){
    now=now||Date.now();
    pet.locked=false;
    pet.timerMode="normal";
    pet.totalMs=hmToMs(72,0);
    pet.pausedAt=pet.totalMs;
    pet.isRunning=false;
    startPetTimer(pet,now); // 内部会更新 utime
}

// 母宠自动锁定：运行中且剩余<=72小时，自动暂停并锁定待接生
const FEMALE_LOCK_REMAIN_MS = hmToMs(72,0);
function checkFemaleAutoLock(now){
    now=now||Date.now();
    let stateChanged=false;
    const alerts=[];
    petList.forEach(function(p){
        if(p.isRunning && !p.locked && p.timerMode!=="breedFemale"){
            const rem=getPetRemainMs(p,now);
            if(rem<=0){
                p.isRunning=false;
                p.pausedAt=0;
                touchPet(p,now);
                stateChanged=true;
            }
        }
        if(p.timerMode==="breedFemale" && p.isRunning && !p.locked){
            const rem=getPetRemainMs(p,now);
            if(rem<=FEMALE_LOCK_REMAIN_MS){
                p.pausedAt=FEMALE_LOCK_REMAIN_MS;
                p.isRunning=false;
                p.locked=true;
                touchPet(p,now);
                stateChanged=true;
                alerts.push("【"+(p.name||"未命名")+"】母宠到达接生节点，已自动暂停，请手动接生！");
            }
        }
    });
    petList.filter(function(p){return p.locked;}).forEach(function(p){
        const msg="【"+(p.name||"未命名")+"】母宠待接生";
        if(alerts.indexOf(msg)===-1) alerts.push(msg);
    });
    const box=document.getElementById("globalAlertBox");
    if(alerts.length>0){
        box.classList.remove("hidden");
        box.textContent=alerts.join(" ｜ ");
    }else{
        box.classList.add("hidden");
        box.textContent="";
    }
    return stateChanged;
}

function buildCard(pet,now){
    const div=document.createElement("div");
    div.className="pet-card"+(pet.locked?" locked":"");
    const remMs=getPetRemainMs(pet,now);
    const endTs=getEstimateEndTime(pet,now);
    let statusText="";
    let timeExtra="";
    if(pet.locked){
        statusText="🔒待手动接生，倒计时已自动暂停";
    }else if(remMs<=0){
        const cpVal=(pet.cp||"").trim();
        if(cpVal===""){
            statusText='<span class="status-idle">🟢空闲</span>';
        }else{
            statusText='<span class="status-waitpair">💗待配对('+escapeHtml(cpVal)+')</span>';
        }
    }else if(pet.isRunning){
        statusText="⏱计时运行中";
        if(endTs){
            timeExtra='<div style="font-size:12px;color:#666">预计恢复：'+formatDateTime(endTs)+'</div>';
        }
    }else{
        statusText="⏸托管暂停";
    }
    const genderTxt=pet.gender==="m"?'<span class="gender-m">公</span>':'<span class="gender-f">母</span>';
    const tagHtml=(pet.tags||[]).map(function(t){return '<span class="tag">'+escapeHtml(t)+'</span>';}).join(" ");
    const cpDisplay=(pet.cp||"").trim()?'<div style="font-size:12px;color:#777">CP：'+escapeHtml(pet.cp)+'</div>':"";
    const imgHtml=pet.img?'<div class="avatar-wrap" data-bigimg="'+escapeHtml(pet.img)+'"><img src="'+escapeHtml(pet.img)+'"></div>':'<div class="avatar-wrap"></div>';
    div.innerHTML=
        '<div class="card-head">'+imgHtml+
        '<div class="info-main">'+
            '<div class="pet-name">'+escapeHtml(pet.name||"未命名")+' '+genderTxt+'</div>'+
            '<div style="font-size:12px;color:#666">账号:'+escapeHtml(pet.account||"-")+'｜品种:'+escapeHtml(pet.breed||"-")+'</div>'+
            cpDisplay+
            '<div class="tags-wrap">'+tagHtml+'</div>'+
            '<div class="timer-area">'+statusText+'<br/>剩余：'+msToHMS(remMs)+timeExtra+'</div>'+
        '</div></div>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+
            '<button data-act="start" data-id="'+pet.id+'" '+((pet.isRunning||pet.locked)?"disabled":"")+'>▶开始</button>'+
            '<button data-act="pause" data-id="'+pet.id+'" '+((!pet.isRunning||pet.locked)?"disabled":"")+'>⏸托管暂停</button>'+
            '<button data-act="reset" data-id="'+pet.id+'">↺重置</button>'+
            (pet.locked?'<button data-act="deliverBaby" data-id="'+pet.id+'" style="background:#28c76f;color:#fff">✅接生完成</button>':"")+
            '<button data-act="edit" data-id="'+pet.id+'">✏编辑</button>'+
        '</div>'+
        (pet.note?'<div style="margin-top:6px;font-size:12px;color:#555">备注：'+escapeHtml(pet.note)+'</div>':"");
    return div;
}

function render(){
    const now=Date.now();
    const locked=checkFemaleAutoLock(now);
    if(locked) saveToLocal();
    renderFilterSelect();
    const kw=document.getElementById("searchInput").value.trim().toLowerCase();
    const filterStatus=document.getElementById("filterStatusSel").value;
    const filterGender=document.getElementById("filterGenderSel").value;
    const filterAcc=document.getElementById("filterAccountSel").value;
    const filterBr=document.getElementById("filterBreedSel").value;
    const sortMode=document.getElementById("sortModeSel").value;

    let list=petList.slice();
    if(kw){
        list=list.filter(function(p){
            const name=(p.name||"").toLowerCase();
            const cp=(p.cp||"").toLowerCase();
            const tags=(p.tags||[]).join(",").toLowerCase();
            return name.includes(kw)||cp.includes(kw)||tags.includes(kw);
        });
    }
    if(filterStatus){
        list=list.filter(function(p){
            const remMs=getPetRemainMs(p,now);
            const cpVal=(p.cp||"").trim();
            if(filterStatus==="cd") return p.isRunning&&!p.locked;
            if(filterStatus==="paused") return !p.isRunning&&!p.locked&&remMs>0;
            if(filterStatus==="locked") return !!p.locked;
            if(filterStatus==="idle") return !p.locked&&remMs<=0&&cpVal==="";
            if(filterStatus==="waitpair") return !p.locked&&remMs<=0&&cpVal!=="";
            return true;
        });
    }
    if(filterGender){
        list=list.filter(function(p){return p.gender===filterGender;});
    }
    if(filterAcc){
        list=list.filter(function(p){return (p.account||"")===filterAcc;});
    }
    if(filterBr){
        list=list.filter(function(p){return (p.breed||"")===filterBr;});
    }

    // ===== 排序 =====
    if(sortMode==="editTime"){
        // 最近编辑在前
        list.sort(function(a,b){
            return (b.utime||b.ctime||0) - (a.utime||a.ctime||0);
        });
    }else{
        // 默认：剩余时间升序
        list.sort(function(a,b){
            return getPetRemainMs(a,now)-getPetRemainMs(b,now);
        });
    }

    const container=document.getElementById("petContainer");
    container.innerHTML="";
    list.forEach(function(p){container.appendChild(buildCard(p,now));});
}

// ===== 大图预览 =====
const previewModal=document.getElementById("imgPreviewModal");
const previewImg=document.getElementById("previewBigImg");
previewModal.onclick=function(){previewModal.classList.remove("show");};

// ===== 卡片点击事件（事件委托）=====
document.getElementById("petContainer").addEventListener("click",function(e){
    const wrap=e.target.closest(".avatar-wrap");
    if(wrap){
        const src=wrap.getAttribute("data-bigimg");
        if(src){previewImg.src=src;previewModal.classList.add("show");}
        return;
    }
    const btn=e.target.closest("button[data-act]");
    if(!btn) return;
    const act=btn.getAttribute("data-act");
    const pid=btn.getAttribute("data-id");
    const pet=petList.find(function(x){return x.id===pid;});
    if(!pet) return;
    const now=Date.now();
    if(act==="start") startPetTimer(pet,now);
    else if(act==="pause") pausePetTimer(pet,now);
    else if(act==="reset") resetPetTimer(pet,now);
    else if(act==="deliverBaby") deliverBaby(pet,now);
    else if(act==="edit"){openEdit(pid);return;}
    saveToLocal();
    render();
});

// ===== 管理弹窗删除 =====
document.getElementById("optManageModal").addEventListener("click",function(e){
    const delBtn=e.target.closest(".del-opt");
    if(!delBtn) return;
    const type=delBtn.getAttribute("data-type");
    const idx=Number(delBtn.getAttribute("data-idx"));
    if(!confirm("确认删除该选项？已存在宠物档案里的此字段不会被清空。")) return;
    if(type==="acc") accountOptions.splice(idx,1);
    else if(type==="breed") breedOptions.splice(idx,1);
    saveToLocal();
    renderOptionManager();
    renderFilterSelect();
    render();
});
document.getElementById("btnManageOpt").onclick=function(){
    renderOptionManager();
    document.getElementById("optManageModal").classList.remove("hidden");
};
document.getElementById("closeOptManage").onclick=function(){
    document.getElementById("optManageModal").classList.add("hidden");
};

// ===== 剪贴板粘贴图片 =====
document.getElementById("petImgUrl").addEventListener("paste",function(e){
    const items=e.clipboardData.items;
    for(let i=0;i<items.length;i++){
        if(items[i].type.indexOf("image/")===0){
            const f=items[i].getAsFile();
            const r=new FileReader();
            r.onload=function(ev){document.getElementById("petImgUrl").value=ev.target.result;};
            r.readAsDataURL(f);
            e.preventDefault();
            break;
        }
    }
});
document.getElementById("uploadImg").onchange=function(e){
    const f=e.target.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=function(ev){document.getElementById("petImgUrl").value=ev.target.result;};
    r.readAsDataURL(f);
};

// ===== 编辑弹窗 =====
const modal=document.getElementById("editModal");
document.getElementById("btnAdd").onclick=function(){openEdit(null);};
document.getElementById("btnCancel").onclick=closeEdit;

function openEdit(pid){
    editId=pid;
    modal.classList.remove("hidden");
    document.getElementById("modalTitle").textContent=pid?"编辑宠物档案":"新增宠物档案";
    document.getElementById("btnDel").classList.toggle("hidden",!pid);
    document.getElementById("petImgUrl").value="";
    document.getElementById("txtAccount").value="";
    document.getElementById("txtBreed").value="";
    document.getElementById("petCp").value="";
    document.getElementById("petName").value="";
    document.getElementById("petGender").value="m";
    document.getElementById("petTags").value="";
    document.getElementById("timerMode").value="normal";
    document.getElementById("tHour").value=0;
    document.getElementById("tMinute").value=0;
    document.getElementById("petNote").value="";
    fillEditSelects();
    if(pid){
        const p=petList.find(function(x){return x.id===pid;});
        if(p){
            document.getElementById("petImgUrl").value=p.img||"";
            document.getElementById("petCp").value=p.cp||"";
            document.getElementById("petName").value=p.name||"";
            document.getElementById("petGender").value=p.gender||"m";
            document.getElementById("petTags").value=(p.tags||[]).join(",");
            document.getElementById("timerMode").value=p.timerMode||"normal";
            const totalMin=Math.round((p.totalMs||0)/(60000));
            document.getElementById("tHour").value=Math.floor(totalMin/60);
            document.getElementById("tMinute").value=totalMin%60;
            document.getElementById("petNote").value=p.note||"";
            fillEditSelects(p.account||"",p.breed||"");
        }
    }
}
function closeEdit(){
    modal.classList.add("hidden");
    editId=null;
}

// ===== 保存按钮 =====
document.getElementById("btnSave").onclick=function(){
    const selAcc=document.getElementById("selAccount").value.trim();
    const txtAcc=document.getElementById("txtAccount").value.trim();
    const selBr=document.getElementById("selBreed").value.trim();
    const txtBr=document.getElementById("txtBreed").value.trim();
    const accountVal=selAcc||txtAcc;
    const breedVal=selBr||txtBr;
    const cpVal=document.getElementById("petCp").value.trim();
    const nameVal=document.getElementById("petName").value.trim()||"未命名";
    const genderVal=document.getElementById("petGender").value;
    const tagsStr=document.getElementById("petTags").value.trim();
    const tagsArr=tagsStr?tagsStr.split(",").map(function(s){return s.trim();}).filter(Boolean):[];
    const tMode=document.getElementById("timerMode").value;
    const h=Number(document.getElementById("tHour").value||0);
    const m=Number(document.getElementById("tMinute").value||0);
    const noteVal=document.getElementById("petNote").value.trim();
    const imgVal=document.getElementById("petImgUrl").value.trim();
    const totalMs=hmToMs(h,m);
    const now=Date.now();

    addOption(accountOptions,accountVal);
    addOption(breedOptions,breedVal);

    if(editId){
        const idx=petList.findIndex(function(x){return x.id===editId;});
        if(idx>-1){
            petList[idx]=Object.assign({},petList[idx],{
                img:imgVal,account:accountVal,breed:breedVal,cp:cpVal,
                name:nameVal,gender:genderVal,tags:tagsArr,timerMode:tMode,
                totalMs:totalMs,note:noteVal,
                utime:now
            });
        }
    }else{
        petList.push({
            id:genId(),ctime:now,utime:now,
            img:imgVal,account:accountVal,breed:breedVal,cp:cpVal,
            name:nameVal,gender:genderVal,tags:tagsArr,timerMode:tMode,
            totalMs:totalMs,pausedAt:totalMs,isRunning:false,startTs:null,locked:false,note:noteVal
        });
    }
    closeEdit();
    saveToLocal();
    render();
};

document.getElementById("btnDel").onclick=function(){
    if(!editId) return;
    if(!confirm("确定删除，不可恢复？")) return;
    petList=petList.filter(function(x){return x.id!==editId;});
    closeEdit();
    saveToLocal();
    render();
};

// ===== 导入 =====
document.getElementById("btnImport").onclick=function(){
    const ipt=document.createElement("input");
    ipt.type="file";
    ipt.accept=".json";
    ipt.onchange=function(e){
        const f=e.target.files[0];
        if(!f) return;
        const r=new FileReader();
        r.onload=function(ev){
            let obj;
            try{
                obj=JSON.parse(ev.target.result);
            }catch(err){
                alert("导入失败：文件不是有效的JSON");
                return;
            }
            if(!obj||!Array.isArray(obj.pets)){
                alert("导入失败：备份文件缺少pets数据");
                return;
            }
            const migratedPets=obj.pets.map(function(p){
                const created = p.ctime || Date.now();
                return {
                    id:p.id||genId(),
                    ctime:created,
                    utime:p.utime||created,   // 兼容旧备份
                    img:p.img||"",
                    account:p.account||"",
                    breed:p.breed||"",
                    cp:p.cp||"",
                    name:p.name||"未命名",
                    gender:p.gender||"m",
                    tags:Array.isArray(p.tags)?p.tags:[],
                    timerMode:p.timerMode||"normal",
                    totalMs:p.totalMs||0,
                    pausedAt:p.pausedAt||0,
                    isRunning:!!p.isRunning,
                    startTs:p.startTs||null,
                    locked:!!p.locked,
                    note:p.note||""
                };
            });
            if(!confirm("导入将覆盖当前全部数据，确认继续？")) return;
            petList=migratedPets;
            accountOptions=Array.isArray(obj.accounts)?obj.accounts:[];
            breedOptions=Array.isArray(obj.breeds)?obj.breeds:[];
            saveToLocal();
            render();
            alert("导入成功，共"+migratedPets.length+"只宠物");
        };
        r.readAsText(f);
    };
    ipt.click();
};

document.getElementById("btnExport").onclick=function(){
    const payload={pets:petList,accounts:accountOptions,breeds:breedOptions};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="pet-timer-v11-backup.json";
    a.click();
};

// 筛选 / 排序事件
document.getElementById("searchInput").oninput=render;
document.getElementById("filterStatusSel").onchange=render;
document.getElementById("filterGenderSel").onchange=render;
document.getElementById("filterAccountSel").onchange=render;
document.getElementById("filterBreedSel").onchange=render;
document.getElementById("sortModeSel").onchange=render;

loadFromLocal();
render();
setInterval(render,1000);
</script>
